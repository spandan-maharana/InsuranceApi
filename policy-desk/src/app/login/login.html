<section class="login">
  @if (role() === null) {
    <h1>Staff login</h1>
    <p class="lead">Who are you signing in as?</p>

    <div class="choices">
      <button type="button" class="choice" (click)="choose('Agent')">
        <span class="icon">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21a8 8 0 0 1 16 0" />
          </svg>
        </span>
        <span class="choice-title">Agent</span>
        <span class="choice-text">
          Review quote requests, price quotes and send them to the underwriter.
        </span>
      </button>

      <button type="button" class="choice" (click)="choose('Underwriter')">
        <span class="icon">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3 4 6v6c0 4.5 3.2 8.3 8 9 4.8-.7 8-4.5 8-9V6l-8-3z" />
            <path d="m9 12 2 2 4-4" />
          </svg>
        </span>
        <span class="choice-title">Underwriter</span>
        <span class="choice-text">
          Review accepted quotes, approve them and issue policies.
        </span>
      </button>

      <button type="button" class="choice" (click)="choose('SuperUser')">
        <span class="icon">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="7" height="9" rx="1" />
            <rect x="14" y="3" width="7" height="5" rx="1" />
            <rect x="14" y="12" width="7" height="9" rx="1" />
            <rect x="3" y="16" width="7" height="5" rx="1" />
          </svg>
        </span>
        <span class="choice-title">Administrator</span>
        <span class="choice-text">
          See everything across all agents and manage staff accounts.
        </span>
      </button>
    </div>
  } @else {
    <div class="card">
      <button type="button" class="back" (click)="back()">&larr; Choose a different role</button>

      <h1>{{ roleTitle() }} login</h1>
      <p class="lead">Enter your username and password.</p>

      <form (submit)="onSubmit($event)">
        <label class="field">
          Username
          <input type="text" autocomplete="username" [class.invalid]="!!error()"
                 [value]="username()" (input)="username.set(read($event))" />
        </label>

        <label class="field">
          Password
          <input type="password" autocomplete="current-password" [class.invalid]="!!error()"
                 [value]="password()" (input)="password.set(read($event))" />
        </label>

        @if (error()) {
          <p class="error" role="alert">{{ error() }}</p>
        }

        <button type="submit" class="submit"
                [disabled]="busy() || !username().trim() || !password()">
          {{ busy() ? 'Signing in...' : 'Log in' }}
        </button>
      </form>
    </div>
  }
</section>
